name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Check PR title
      uses: amannn/action-semantic-pull-request@v5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        types: |
          feat
          fix
          docs
          style
          refactor
          test
          chore
        requireScope: false
    
    - name: Check for merge conflicts
      run: |
        git fetch origin ${{ github.base_ref }}
        git merge-base --is-ancestor origin/${{ github.base_ref }} HEAD || \
        (echo "Branch is behind base branch" && exit 1)
    
    - name: Validate files changed
      run: |
        echo "Files changed in this PR:"
        git diff --name-only origin/${{ github.base_ref }}...HEAD

  comment:
    name: PR Comment
    runs-on: ubuntu-latest
    needs: validate
    if: github.event.action == 'opened'
    
    steps:
    - name: Comment on PR
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '👋 Thanks for opening this PR! The CI checks are running. Please make sure all tests pass.'
          })

