name: CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Generate deployment artifact
      run: |
        echo "Image: ${{ steps.meta.outputs.tags }}" > deployment-info.txt
        echo "SHA: ${{ github.sha }}" >> deployment-info.txt
        echo "Date: $(date)" >> deployment-info.txt

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: deployment-info
        path: deployment-info.txt

  deploy-to-railway:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
    steps:
      - name: Deploy to Railway
        run: railway deployment trigger --service=${{ secrets.RAILWAY_SERVICE_ID }} --image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest -d

